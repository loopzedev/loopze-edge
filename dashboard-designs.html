<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>loopze — 10 Dashboard Design Proposals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --logo-path: "M13 2L3 14h8l-1 8 10-12h-8l1-8z"; }

  body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0f;
    color: #e2e8f0;
    min-height: 100vh;
  }

  /* ─── NAV ─── */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(10,10,15,.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,.06);
    padding: 0 2rem;
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 1.1rem; letter-spacing: -.02em;
  }
  .nav-brand svg { width: 22px; height: 22px; }
  .nav-pills {
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
  }
  .pill {
    padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
    border: 1px solid rgba(255,255,255,.12); background: transparent;
    color: #94a3b8; cursor: pointer; transition: all .2s;
    font-family: inherit;
  }
  .pill:hover { border-color: rgba(255,255,255,.3); color: #e2e8f0; }
  .pill.active { color: #0a0a0f; border-color: transparent; font-weight: 600; }

  /* ─── HERO ─── */
  .hero {
    padding: 120px 2rem 60px;
    text-align: center;
  }
  .hero h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 800; letter-spacing: -.04em; line-height: 1.1;
    background: linear-gradient(135deg, #fff 30%, #58a6ff 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 1rem;
  }
  .hero p {
    color: #64748b; font-size: 1.05rem; max-width: 560px; margin: 0 auto 2.5rem;
  }

  /* ─── GRID ─── */
  .designs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 2rem;
    padding: 0 2rem 6rem;
    max-width: 1600px;
    margin: 0 auto;
  }

  /* ─── DESIGN CARD ─── */
  .design-card {
    border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.06);
    transition: transform .3s, box-shadow .3s;
    cursor: pointer;
  }
  .design-card:hover {
    transform: translateY(-4px);
  }
  .design-badge {
    position: absolute; top: 14px; left: 14px;
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    padding: 3px 10px; border-radius: 20px;
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    backdrop-filter: blur(8px);
  }
  .design-preview {
    position: relative;
    height: 320px;
    overflow: hidden;
  }
  .design-info {
    padding: 1.25rem 1.5rem;
    background: rgba(255,255,255,.025);
    border-top: 1px solid rgba(255,255,255,.06);
  }
  .design-info h3 {
    font-size: 1rem; font-weight: 700; margin-bottom: .25rem;
    letter-spacing: -.02em;
  }
  .design-info p {
    font-size: .8rem; color: #64748b; margin-bottom: .75rem; line-height: 1.5;
  }
  .palette {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .swatch {
    width: 28px; height: 28px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,.1);
    position: relative;
    cursor: default;
  }
  .swatch:hover::after {
    content: attr(data-color);
    position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #e2e8f0;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    padding: 3px 6px; border-radius: 4px; white-space: nowrap;
    pointer-events: none; z-index: 10;
  }

  /* ─── SHARED DASHBOARD ELEMENTS ─── */
  .db-shell {
    width: 100%; height: 100%; display: flex; font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    position: relative; overflow: hidden;
  }
  .db-sidebar {
    width: 52px; height: 100%; display: flex; flex-direction: column;
    align-items: center; padding: 12px 0; gap: 4px;
    flex-shrink: 0;
  }
  .db-logo {
    width: 28px; height: 28px; display: flex; align-items: center;
    justify-content: center; border-radius: 8px; margin-bottom: 8px;
  }
  .db-logo svg { width: 16px; height: 16px; }
  .db-nav-icon {
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    opacity: .45; transition: all .15s;
  }
  .db-nav-icon.active { opacity: 1; }
  .db-nav-icon svg { width: 15px; height: 15px; }
  .db-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .db-topbar {
    height: 40px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; flex-shrink: 0; border-bottom: 1px solid;
  }
  .db-title { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; }
  .db-topbar-right { display: flex; gap: 6px; align-items: center; }
  .db-dot { width: 6px; height: 6px; border-radius: 50%; }
  .db-content { flex: 1; padding: 12px; display: grid; gap: 8px;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto auto 1fr;
    overflow: hidden;
  }
  .db-widget {
    border-radius: 8px; padding: 10px; border: 1px solid;
    display: flex; flex-direction: column; gap: 4px;
    overflow: hidden;
  }
  .db-widget.span2 { grid-column: span 2; }
  .db-widget.span3 { grid-column: span 3; }
  .db-widget-label { font-size: 9px; opacity: .5; text-transform: uppercase; letter-spacing: .08em; }
  .db-widget-value { font-size: 18px; font-weight: 700; font-family: 'Inter', sans-serif; letter-spacing: -.04em; }
  .db-widget-sub { font-size: 9px; opacity: .45; }
  .db-chart { flex: 1; position: relative; overflow: hidden; border-radius: 4px; }
  /* mini sparkline via SVG inline */
  .db-bar-row {
    display: flex; align-items: flex-end; gap: 3px; height: 40px;
    padding-top: 4px;
  }
  .db-bar {
    flex: 1; border-radius: 2px 2px 0 0;
    min-height: 4px;
  }
  .db-line-chart { width: 100%; height: 100%; }
  .db-table-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0; border-bottom: 1px solid; opacity: .85;
    font-size: 9px;
  }
  .db-table-row:last-child { border-bottom: none; }
  .db-status-dot { width: 5px; height: 5px; border-radius: 50%; margin-right: 5px; display: inline-block; }
  .db-avatar {
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700;
  }
</style>
</head>

    activity: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
    database: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>`,
    settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
  };
  const bg = active ? color + '22' : 'transparent';
  return `<div class="db-nav-icon ${active?'active':''}" style="background:${bg};color:${color};">${icons[type]}</div>`;
}

function kpi(label, value, sub, accent, bg, border) {
  return `<div class="db-widget" style="background:${bg};border-color:${border};">
    <div class="db-widget-label" style="color:${accent};">${label}</div>
    <div class="db-widget-value" style="color:${accent};">${value}</div>
    <div class="db-widget-sub">${sub}</div>
  </div>`;
}

function bars(colors, heights, bgColor) {
  const maxH = Math.max(...heights);
  return `<div class="db-bar-row">
    ${heights.map((h,i)=>`<div class="db-bar" style="height:${(h/maxH)*36}px;background:${colors[i%colors.length]};opacity:.85;"></div>`).join('')}
  </div>`;
}

function tableRows(rows, borderColor, textColor) {
  return rows.map(([name, status, color]) => `
    <div class="db-table-row" style="border-color:${borderColor};color:${textColor};">
      <span><span class="db-status-dot" style="background:${color};"></span>${name}</span>
      <span style="color:${color};font-size:9px;">${status}</span>
    </div>`).join('');
}

function avatar(initials, bg, border) {
  return `<div class="db-avatar" style="background:${bg}22;border:1px solid ${border};color:${bg};">${initials}</div>`;
}

function lineChartSVG(color1, color2) {
  const pts = [30,45,35,60,50,70,55,75,60,85,70,80,75,90,82];
  const pts2 = [55,40,58,35,50,45,60,40,55,50,65,45,70,60,68];
  const w=240, h=48, xStep=w/(pts.length-1);
  const toPath=(arr)=>arr.map((v,i)=>`${i===0?'M':'L'}${i*xStep},${h-v*h/100}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:40px;">
    <defs>
      <linearGradient id="g1-${color1.replace('#','')}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color1}" stop-opacity=".3"/>
        <stop offset="100%" stop-color="${color1}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${toPath(pts)} L${w},${h} L0,${h} Z" fill="url(#g1-${color1.replace('#','')})" />
    <path d="${toPath(pts)}" fill="none" stroke="${color1}" stroke-width="1.5"/>
    <path d="${toPath(pts2)}" fill="none" stroke="${color2}" stroke-width="1" stroke-dasharray="3,2" opacity=".6"/>
  </svg>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────
const grid = document.getElementById('grid');
const pillContainer = document.getElementById('pills');

function renderAll() {
  pillContainer.innerHTML = '';
  grid.innerHTML = '';

  DESIGNS.forEach((d, i) => {
    // Pill
    const pill = document.createElement('button');
    pill.className = 'pill';
    pill.textContent = `${i+1}. ${d.name}`;
    pill.style.setProperty('--a', d.accent || '#58a6ff');
    pill.onclick = () => openFullscreen(d);
    pillContainer.appendChild(pill);

    // Card
    const card = document.createElement('div');
    card.className = 'design-card';
    card.style.boxShadow = `0 0 0 1px rgba(255,255,255,.04), 0 20px 40px rgba(0,0,0,.5)`;

    const preview = document.createElement('div');
    preview.className = 'design-preview';
    d.renderPreview(preview);

    const badge = document.createElement('div');
    badge.className = 'design-badge';
    badge.textContent = `#${String(i+1).padStart(2,'0')}`;
    badge.style.background = (d.accent||'#58a6ff') + '22';
    badge.style.color = d.accent || '#58a6ff';
    badge.style.border = `1px solid ${(d.accent||'#58a6ff')}44`;
    preview.appendChild(badge);

    const info = document.createElement('div');
    info.className = 'design-info';
    info.innerHTML = `
      <h3 style="color:${d.accent||'#e2e8f0'};">${d.name}</h3>
      <p>${d.tagline}</p>
      <p style="font-size:.78rem;color:#4a5568;margin-bottom:.75rem;">${d.desc}</p>
      <div class="palette">
        ${d.palette.map(c=>`<div class="swatch" style="background:${c};" data-color="${c}" title="${c}"></div>`).join('')}
      </div>`;

    card.appendChild(preview);
    card.appendChild(info);
    card.onclick = (e) => { if (!e.target.classList.contains('swatch')) openFullscreen(d); };
    grid.appendChild(card);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// FULLSCREEN MODAL
// ─────────────────────────────────────────────────────────────────────────────
function openFullscreen(d) {
  const overlay = document.createElement('div');
  overlay.style.cssText = `
    position:fixed;inset:0;z-index:1000;
    background:rgba(0,0,0,.85);backdrop-filter:blur(8px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:1rem;
  `;

  const header = document.createElement('div');
  header.style.cssText = `
    width:100%;max-width:1200px;display:flex;align-items:center;justify-content:space-between;
    margin-bottom:1rem;padding:0 .5rem;
  `;
  header.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;">
      <svg style="width:20px;height:20px;" viewBox="1.5 2 20 20" fill="${d.accent||'#58a6ff'}"><path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/></svg>
      <span style="font-weight:700;font-size:1.1rem;color:#e2e8f0;">${d.name}</span>
      <span style="font-size:.85rem;color:#64748b;">${d.tagline}</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div style="display:flex;gap:6px;">
        ${d.palette.map(c=>`<div style="width:24px;height:24px;border-radius:6px;background:${c};border:1px solid rgba(255,255,255,.1);" title="${c}"></div>`).join('')}
      </div>
      <button id="closeBtn" style="
        background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
        color:#e2e8f0;padding:6px 16px;border-radius:8px;cursor:pointer;
        font-family:inherit;font-size:13px;margin-left:12px;
      ">✕ Schließen</button>
    </div>`;

  const previewFull = document.createElement('div');
  previewFull.style.cssText = `
    width:100%;max-width:1200px;height:min(70vh,700px);
    border-radius:16px;overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 40px 80px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.04);
  `;
  d.renderPreview(previewFull);

  const desc = document.createElement('div');
  desc.style.cssText = `
    width:100%;max-width:1200px;margin-top:.75rem;padding:0 .5rem;
    color:#64748b;font-size:.85rem;
  `;
  desc.textContent = d.desc;

  overlay.appendChild(header);
  overlay.appendChild(previewFull);
  overlay.appendChild(desc);
  document.body.appendChild(overlay);

  document.getElementById('closeBtn').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', esc); }
  });
}

renderAll();
</script>

<style>
@keyframes pulse {
  0%,100% { opacity:1; }
  50% { opacity:.4; }
}
</style>
</body>
