# LOOPZE Mosquitto demo broker — three listeners exposing every TLS
# permutation a LOOPZE flow might want to test:
#
#   1883  plain MQTT, anonymous
#   8883  MQTT over TLS, anonymous (broker presents its cert)
#   8884  MQTT over mTLS, broker AND client must present cert
#
# Persistence and logging are written under /mosquitto/data and
# /mosquitto/log inside the container, mounted from the host so the
# state survives `docker compose down`.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ─── 1883 — plain ────────────────────────────────────────────────────────
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# ─── 8883 — TLS, broker auth only ────────────────────────────────────────
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous true
cafile   /mosquitto/certs/ca/ca.pem
certfile /mosquitto/certs/server/server.pem
keyfile  /mosquitto/certs/server/server.key
require_certificate false
tls_version tlsv1.2

# ─── 8884 — mTLS, broker + client auth ───────────────────────────────────
listener 8884 0.0.0.0
protocol mqtt
allow_anonymous true
cafile             /mosquitto/certs/ca/ca.pem
certfile           /mosquitto/certs/server/server.pem
keyfile            /mosquitto/certs/server/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
